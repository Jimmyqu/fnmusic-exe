<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>飞牛音乐 - 服务器设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #2a1a4a 0%, #14101f 55%, #0b0a12 100%);
      color: #f2f2f7;
      overflow: hidden;
    }
    /* 无边框窗口顶部拖拽条：高度与原生覆盖层按钮一致(36px) */
    .titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      -webkit-app-region: drag;
      z-index: 100;
    }
    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
    }
    .card {
      width: 480px;
      max-width: 90vw;
      padding: 48px 44px 40px;
      background: rgba(28, 22, 46, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(14px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
      border-radius: 24px;
      background: linear-gradient(135deg, #b06ab3, #4568dc);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(176, 106, 179, 0.45);
      overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 14px;
      color: #a89fc4;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .field {
      position: relative;
      margin-bottom: 16px;
      text-align: left;
    }
    .field label {
      display: block;
      font-size: 13px;
      color: #c8c0e0;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    input::placeholder { color: #6f6889; }
    input:focus {
      border-color: #b06ab3;
      background: rgba(255, 255, 255, 0.1);
    }
    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #b06ab3, #4568dc);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.2s;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      color: #ff8a8a;
    }
    .hint {
      margin-top: 22px;
      font-size: 12px;
      color: #6f6889;
      line-height: 1.5;
    }
    .hint a {
      color: #8a9bf0;
      text-decoration: none;
      word-break: break-all;
    }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="wrap">
    <div class="card">
      <div class="logo">
        <img src="build/icon.png" alt="logo" onerror="this.style.display='none'" />
      </div>
      <h1>飞牛音乐</h1>
      <p class="sub">请输入音乐服务器地址以继续<br />首次使用需要配置一次，之后将自动连接</p>

      <form id="form">
        <div class="field">
          <label for="url">服务器地址</label>
          <input id="url" type="text" autofocus autocomplete="off"
                 placeholder="IP / 网址，纯IP默认补 5666 端口" spellcheck="false" />
        </div>
        <button class="btn" id="btn" type="submit">连接</button>
        <div class="msg" id="msg"></div>
      </form>

      <p class="hint">
        提示：可输入纯 IP、网址<br />
        纯 IP（如 192.168.1.1）自动补 http 与 5666 端口<br />
        带协议 / 带端口则用输入值；结尾无 /music 自动补全<br />
        项目地址：<a href="https://github.com/wbc389561407/fnmusic-exe" id="repo-link" target="_blank" rel="noopener">github.com/wbc389561407/fnmusic-exe</a>
      </p>
    </div>
  </div>

  <script src="setup.js"></script>
</body>
</html>
