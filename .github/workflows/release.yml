name: Build & Release

on:
  push:
    tags:
      - 'v*'  # 推送 v 开头的 tag 时触发自动打包并发布 Release
  workflow_dispatch:  # 支持在 Actions 页面手动点「Run workflow」触发（仅打包，不发布 Release）

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 打包产物上传到 Actions 运行页面（手动触发也能从这里下载 .exe）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnmusic-windows
          path: dist/fnmusic-Setup-*.exe

      # 仅 tag 触发时才发布到 GitHub Releases
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fnmusic-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
